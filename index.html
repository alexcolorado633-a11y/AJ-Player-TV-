<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101224">
<title>AJ Player TV — Conectar pelo celular</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#26244c,#101224 65%);color:#fff;font:16px system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}.panel{width:min(100%,430px);background:#1b1e33;border:1px solid #414268;border-radius:22px;padding:28px;box-shadow:0 18px 60px #0006}h1{margin:0;text-align:center;font-size:29px;color:#b9a4ff}p{color:#c5c8dd;line-height:1.5;text-align:center}label{display:block;margin:17px 0 7px;font-weight:600;font-size:14px}input{width:100%;padding:14px;border-radius:11px;border:1px solid #575b7b;background:#101224;color:white;font-size:16px}input:focus{outline:2px solid #9477ff}button{margin-top:24px;width:100%;padding:15px;border:0;border-radius:11px;background:#615c77;color:#eee;font-size:16px;font-weight:700;cursor:not-allowed}.notice{background:#302b42;border:1px solid #76678f;border-radius:10px;padding:12px;font-size:13px;color:#e2d9ff;text-align:left}small{display:block;text-align:center;margin-top:18px;color:#a7abc3}
</style>
</head>
<body><main class="panel">
<h1>AJ PLAYER TV</h1>
<p>Configure sua TV pelo celular</p>
<div class="notice">Página em preparação. O envio para a TV ainda não está habilitado. Não informe credenciais reais durante os testes.</div>
<form autocomplete="off" onsubmit="return false">
<label for="url">URL do servidor</label><input id="url" type="url" placeholder="https://servidor.exemplo" autocomplete="off">
<label for="usuario">Usuário</label><input id="usuario" type="text" placeholder="Seu usuário" autocomplete="off">
<label for="senha">Senha</label><input id="senha" type="password" placeholder="Sua senha" autocomplete="off">
<button type="button" disabled>Conectar à TV — em breve</button>
</form><small>AJ Player TV • Página de demonstração</small>
</main></body>
</html>
